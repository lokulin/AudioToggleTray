name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'      # e.g. v1.0.0, v1.2.3
  workflow_dispatch:    # allows manual runs from the Actions tab

permissions:
  contents: write       # required so the workflow can create a release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AudioToggleTray.csproj

      - name: Publish (framework-dependent, single-file, win-x64)
        run: >
          dotnet publish AudioToggleTray.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Zip published output
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path publish\* -DestinationPath "AudioToggleTray-$version-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AudioToggleTray-*.zip
          generate_release_notes: true

      - name: Notify Death.FM Players site to rebuild
        continue-on-error: true # don't fail the release if the deploy hook secret isn't set up yet
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"